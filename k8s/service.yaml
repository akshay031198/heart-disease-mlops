apiVersion: v1
kind: Service
metadata:
  name: heart-disease-api
  namespace: heart-mlops
  labels:
    app: heart-disease-api
spec:
  type: LoadBalancer        # Docker Desktop -> localhost; Minikube -> `minikube tunnel`
  selector:
    app: heart-disease-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
